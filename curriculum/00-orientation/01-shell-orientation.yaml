apiVersion: kubecrypt.io/v1alpha1
id: shell-orientation
mode: orientation
observeDelay: 60s
title: Shell Orientation
description: |
  The training surface is a permanent split view.

  The left pane is the scenario: objective, hints, and validation.

  The right pane is a real Lab Shell attached to the isolated cluster
  kubeconfig. Type kubectl there. The scenario stays visible.
revision: 2026-09
module: orientation
difficulty: 1
kubernetes:
  min: "1.35"
  max: "1.35"
requires:
  - multi-node
tracks:
  - beginner
objective: |
  In the Lab Shell, run kubectl config current-context and confirm you are
  using the isolated KubeCrypt context. Press F2 to validate.
concepts:
  - kubectl
  - kubeconfig
  - lab-shell
setup:
  manifests: []
checks:
  - type: nodeTopology
    count: 3
    controlPlanes: 1
    workers: 2
hints:
  - Press ? for a hint. F1 also works in a standalone terminal.
  - Run kubectl config current-context to inspect the isolated context.
  - Press F2 to validate cluster state. F11 zooms the shell.
completion: |
  The Lab Shell is a real shell with an isolated kubeconfig. The scenario pane
  stays visible so you can work the way the certification exam does: task on
  one side, terminal on the other.
debrief:
  explanation: |
    KubeCrypt keeps the scenario and a real PTY shell on screen at the same
    time. Commands run against the dedicated kind cluster. KubeCrypt evaluates
    cluster state and does not inspect command history. Press F11 when an
    editor needs more space; F10 leaves the scenario.
  commands:
    - kubectl config current-context
  concepts:
    - isolated kubeconfig
    - split-screen lab
    - state-based validation
  domain: Foundational kubectl skills
reset:
  manifests: []
