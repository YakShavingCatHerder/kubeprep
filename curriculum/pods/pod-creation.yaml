apiVersion: kubeprep.io/v1alpha1
id: pod-creation
mode: challenge
title: First API Object
description: |
  You have inspected the cluster. Now you write an object into it.

  kubectl does not start a container by itself. It submits an API object:
  apiVersion, kind, metadata, and spec.

  The API server stores that document as cluster state. How you submit it
  does not matter.
revision: 2026-09
module: pods
namespace: kubeprep-beginner
difficulty: 1
kubernetes:
  min: "1.35"
  max: "1.35"
requires:
  - multi-node
tracks:
  - beginner
  - cka
  - ckad
objective: |
  Create a Pod named nginx in namespace kubeprep-beginner. The Pod's
  container image must be nginx:1.27.

  kubectl run, kubectl create, and kubectl apply are all valid. Validation
  reads the stored object, not the command you used.
concepts:
  - api-object
  - desired-state
  - namespace
  - yaml
  - kubectl
  - pod
checks:
  - type: objectExists
    kind: pod
    namespace: kubeprep-beginner
    name: nginx
  - type: fieldEquals
    kind: pod
    namespace: kubeprep-beginner
    name: nginx
    field: spec.containers[0].image
    value: nginx:1.27
hints:
  - Kubernetes objects are documents submitted to the API server. A Pod is a namespaced API object whose spec names a container image.
  - Inspect namespace kubeprep-beginner. Look for a Pod named nginx and read the image in its spec, not only whether a container is Running.
  - Submit the object. One valid path is kubectl run nginx --image=nginx:1.27 -n kubeprep-beginner. Applying a Pod manifest with the same name, namespace, and image is equally valid.
completion: |
  Pod nginx exists in kubeprep-beginner with image nginx:1.27. That is
  the API object you submitted.
debrief:
  explanation: |
    kubectl sent a Pod object to the API server. The API server persisted it
    as cluster state: kind Pod, name nginx, namespace kubeprep-beginner,
    spec.containers[0].image nginx:1.27.

    kubectl run, kubectl create, and kubectl apply are different ways to write
    the same object. Status fields such as Ready are observed later by kubelet
    and the control plane; they are not the document you authored. A Deployment
    named nginx is a different kind, so it would not satisfy this Pod object.
  commands:
    - kubectl get pod nginx -n kubeprep-beginner -o yaml
    - kubectl run nginx --image=nginx:1.27 -n kubeprep-beginner
    - kubectl apply -f pod.yaml
  concepts:
    - API object
    - desired state
    - namespace
    - kubectl apply
    - Pod
  domain: Kubernetes API primitives
