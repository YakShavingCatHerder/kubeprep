checks: []
# Exactly three, in order: concept → what to inspect → one concrete command or next step.
hints:
  - "exec starts a process inside an existing container. It does not create a new Pod and it is not SSH into the Node."
  - "Start with a one-shot command. Pay attention to the `--` boundary before moving to an interactive shell."
  - |
    Try:

    ```kubectl
    kubectl exec nginx -- nginx -v
    ```
# Short confirmation of the proven state. No cheerleading.
completion: |
  You used exec to run one-shot and interactive processes inside the
  existing nginx container.
debrief:
  # Real mechanism: who persisted the object, who scheduled it, what Ready actually is. Name the resources.
  # ::page:: works here too, same as description.
  explanation: |
    `kubectl exec` adds a new debugging perspective.

    Earlier commands inspected the workload from outside:

    ```text
    get
      -> summary
    
    describe
      -> details and Events
    
    YAML
      -> API object
    
    logs
      -> application output
    ```

    `exec` asks a different question:

    ```text
    exec
      -> what can I observe from
         inside the container?
    ```

    ::page::

    Consider the one-shot command:

    ```kubectl
    kubectl exec nginx -- nginx -v
    ```

    kubectl sends an exec request through Kubernetes for the existing
    `nginx` container.

    Kubernetes does not create another Pod or replace the container.

    A new `nginx -v` process runs inside the existing container.

    Its output is returned to your terminal.

    When that process exits, the original nginx server keeps running.

    ::page::

    The `--` boundary matters.

    ```text
    kubectl exec nginx -- nginx -v
    |                  |  |
    kubectl arguments  |  command inside
                       |
                       separator
    ```

    This pattern prevents arguments meant for the container command
    from being interpreted as kubectl flags.

    ::page::

    Interactive exec adds two flags:

    ```kubectl
    kubectl exec -it nginx -- sh
    ```

    `-i` passes standard input to the container process.

    `-t` allocates a terminal for the session.

    `sh` is still just another process started inside the container.

    It feels interactive because your terminal's input and output are
    connected to that process.

    Typing `exit` ends `sh`.

    It does not stop nginx or delete the Pod.

    ::page::

    `exec` is not SSH.

    SSH normally connects to an SSH server running on another machine.

    `kubectl exec` asks Kubernetes to execute a process in an existing
    container.

    If you exec into `nginx`, you are inspecting the container
    environment.

    You are not automatically inspecting the host Node.

    ::page::

    The tools available through exec come from the container image.

    A container may contain:

    ```text
    sh
    ls
    cat
    curl
    package tools
    debugging utilities
    ```

    Or it may contain almost none of them.

    A missing command can therefore mean that the image does not
    include that executable.

    It does not necessarily mean Kubernetes failed.

    This becomes especially important with small production images.

    ::page::

    You now have two basic troubleshooting perspectives:

    ```text
    Outside the container
    
      get
      describe
      YAML
      logs
    
    Inside the container
    
      exec
    ```

    Later labs will combine these views when workloads actually fail.
  # Commands worth remembering after success.
  commands:
    - kubectl exec nginx -- nginx -v
    - kubectl exec nginx -- ls /usr/share/nginx/html
    - kubectl exec -it nginx -- sh
  # Human-readable names for the debrief pane (may differ from concepts:).
  concepts:
    - kubectl exec
    - One-shot processes
    - Interactive shells
    - stdin and TTY
    - Container filesystem
    - exec versus SSH
  # One-line domain label.
  domain: Container inspection with kubectl exec