# pod-exec lab
authoring:
  # Domain folder and catalog section: welcome, api, pods, jobs, deployments, scheduling, storage, services, network-policy, rbac, troubleshooting.
  section: welcome
  # How much help this lab should give: guided | assisted | operator | exam.
  guidance: guided
  intent:
    # One skill or relationship this lab proves that is relevant to the learning path and objective.
    teach: "Use kubectl exec to run a new process inside an existing container and distinguish one-shot commands from an interactive shell."
    # The misconception the lab should break.
    wrongIdea: "kubectl exec is SSH into a Pod or Node, or it creates a new Pod or container."
    # Accurate mechanism in one or two sentences.
    mentalModel: "kubectl exec asks Kubernetes to start another process inside an existing running container. The process uses that container's filesystem and runtime environment; it does not SSH to the Node or create another workload."
    # Why this lab sits here on the playlist.
    why: "The learner has inspected a Pod from the outside using get, describe, YAML, and logs. This lab adds the next troubleshooting perspective: inspecting the workload from inside its running container."
    # In/out of scope, start-state rationale, anything reviewers should not treat as a second objective.
    notes: "This lab is intentionally ungraded because exec activity does not produce a supported cluster-state check. The supplied nginx Pod should remain unchanged. Multi-container selection with -c, ephemeral containers, and deeper container debugging are intentionally deferred."
  # Healthy/target objects for reviewers. Never applied. Pass/fail is checks only.
  desiredClusterConfiguration: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: nginx
      namespace: kubeprep-pod-exec
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
  # Legitimate paths that produce the same graded state (run, create -f, apply -f, edit, patch, …).
  accept:
    - "Use kubectl exec for read-only inspection of the supplied nginx container while leaving the Pod unchanged."
    - "Use one-shot exec commands and an interactive shell in any order while preserving the supplied workload."
  # Near-misses that must fail: wrong kind, namespace, image, or incomplete observed state.
  reject:
    - "Delete, replace, edit, or patch the supplied nginx Pod."
    - "Use exec to intentionally modify the container filesystem or treat the shell as SSH access to the Node."
  # One alternate valid path, to prove the grader is not locked to a single command.
  proveAlternate: "Run several one-shot commands without opening an interactive shell, or open the shell after first understanding the one-shot form."

apiVersion: kubeprep.io/v1alpha1
