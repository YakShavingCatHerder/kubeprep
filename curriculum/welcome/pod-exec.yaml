# observeDelay: 60s
# 1 = first write in a section; 5 = mixed troubleshooting.
difficulty: 1
# Curriculum month this lab targets: YYYY-MM.
revision: 2026-09
# Must match authoring.section and the catalog section that lists this id.
module: welcome
kubernetes:
  min: "1.35"
  max: "1.35"
# Cluster capabilities the lab needs. Empty is valid. Do not leave a blank "- " item.
# Example: multi-node, storage.
requires: []
# Tracks this lab may appear on. Play order is catalog.yaml, not this list.
tracks:
  - beginner
# Workspace Namespace. Must be kubeprep-*. Created on start; wiped and recreated on reset.
# Checks do not inherit this; repeat namespace (or selector) on each check.
namespace: kubeprep-pod-exec
# Inline YAML applied on setup and reset. Empty = namespace only. Prefer a broken or missing object, not a healthy cluster.
startingClusterConfiguration: |
  apiVersion: v1
  kind: Pod
  metadata:
    name: nginx
    namespace: kubeprep-pod-exec
  spec:
    containers:
      - name: nginx
        image: nginx:1.27
# Extra manifests beside this file, applied after the start blob. Use the same list on reset.
setup:
  manifests: []
reset:
  manifests: []
# Learner-facing context: what they already saw, the real mechanism, and that any valid kubectl path works.
# A line that is exactly ::page:: starts a new scenario-pane page (optional surrounding whitespace is fine).
# Keep it indented inside the | block; a flush-left ::page:: splits the string across multiple panes.
description: |
  So far, you have inspected `nginx` from outside its container.

  You used `get`, `describe`, YAML, and logs to ask Kubernetes about
  the workload.

  Sometimes you need a different view.

  You may need to ask:

  What files exist inside the container?

  What software is installed?

  What does the container itself see?

  `kubectl exec` lets you run a command inside an existing container.

  It does not create another Pod.

  It does not SSH into the Node.

  ::page::

  Start with one command:

  ```kubectl
  kubectl exec nginx -- nginx -v
  ```

  Read the command in two halves:

  ```text
  kubectl exec nginx
          |
          | ask Kubernetes to execute
          | something in nginx
  
  --
  
  nginx -v
      |
      | command executed inside
      | the container
  ```

  The `--` separates arguments for kubectl from the command that runs
  in the container.

  Everything after `--` belongs to that command.

  ::page::

  Try inspecting the container's filesystem:

  ```kubectl
  kubectl exec nginx -- ls /usr/share/nginx/html
  ```

  The output comes from inside the nginx container.

  You are not listing files on your Lab Shell.

  You are also not listing files on the Kubernetes Node.

  `exec` started `ls` inside the running container.

  This is a useful distinction:

  ```text
  Lab Shell
      |
      | kubectl exec
      v
  nginx container
      |
      | runs ls
      v
  container filesystem
  ```

  ::page::

  A one-shot command runs, returns its output, and exits.

  You can also start an interactive shell:

  ```kubectl
  kubectl exec -it nginx -- sh
  ```

  Two flags change the session.

  `-i` keeps standard input open.

  `-t` gives the session a terminal.

  Together, they let you interact with the shell running inside the
  container.

  Try asking where you are:

  ```sh
  pwd
  ```

  Look at the nginx files:

  ```sh
  ls /usr/share/nginx/html
  ```

  Inspect the container's operating system:

  ```sh
  cat /etc/os-release
  ```

  Leave the shell when you are finished:

  ```sh
  exit
  ```

  ::page::

  An interactive exec session can feel like SSH, but the mechanism is
  different.

  You did not log in to a machine.

  Kubernetes started another process inside the existing nginx
  container.

  The nginx server kept running while your `sh` process also ran in
  that container.

  When you typed `exit`, the shell process ended.

  The Pod and nginx server continued running.

  ::page::

  There is one more limitation worth knowing now.

  `kubectl exec` can only run programs that exist inside the container
  image.

  The nginx image contains `sh`, so this works:

  ```kubectl
  kubectl exec -it nginx -- sh
  ```

  Another image might not contain a shell or common debugging tools.

  If a command is missing, that does not automatically mean the Pod is
  broken.

  It may simply mean the executable is not part of the image.

  Later troubleshooting labs will cover what to do when a container
  has very few debugging tools.

# Measurable target state: names, namespace, fields, and observed conditions. Not a command recipe.
objective: |
  Inspect the running `nginx` container from inside without changing
  the workload.

  Understand that exec starts another process inside an existing
  container, and distinguish one-shot commands from an interactive
  shell.
# kebab-case tags (not used for scoring today).
concepts:
  - kubectl-exec
  - container
  - process
  - interactive-shell
  - stdin
  - tty
  - container-filesystem
