version: 2

project_name: kubeprep

builds:
  - id: kubeprep
    main: ./cmd/kubeprep
    binary: kubeprep
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/YakShavingCatHerder/kubeprep/internal/cli.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    # .Os/.Arch are lowercase (darwin_arm64, linux_amd64). install.sh and README match this.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  draft: false
  prerelease: auto
